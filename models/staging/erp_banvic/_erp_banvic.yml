
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    schema: erp_banvic
    #database: erp_banvic --> Por algum motivo dá erro se ativado
    tables:
      - name: localidades  
        description: Tabela fonte de localidades com informação de cidade e estado.
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente Banvic.